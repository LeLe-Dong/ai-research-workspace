# RBAC for the AI Research Workspace K8s validator.
#
# This file is INTENTIONALLY not applied by the backend. Per ADR-002
# commit 4 / Q3=3a, the backend ships the yaml, the operator (or a
# cluster-admin) is the one who applies it.
#
# Apply with:
#   kubectl apply -f infra/k8s/rbac/airw-bot-role.yaml
#
# To undo:
#   kubectl delete -f infra/k8s/rbac/airw-bot-role.yaml
#
# This file is part of the "AI in K8s cluster builds experiment data"
# feature (ADR-002). It widens the existing `airw-research:airw-bot`
# service account from the read-only-pods / apply-pod baseline (see
# commit 76ba7c3) to the full set of resources ADR-002 commit 4's
# cleanup path needs to iterate + delete. CRDs and cluster-scoped
# resources are deliberately NOT in this list.
#
# Multi-document YAML (--- separated). kubectl handles this natively;
# most editors will too.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airw-bot
  namespace: airw-research
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airw-bot
  namespace: airw-research-experiments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airw-bot
  namespace: airw-research
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airw-bot
  namespace: airw-research-experiments
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/exec
      - services
      - configmaps
      - persistentvolumeclaims
      - events
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - statefulsets
      - replicasets
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airw-bot
  namespace: airw-research
subjects:
  - kind: ServiceAccount
    name: airw-bot
    namespace: airw-research
roleRef:
  kind: Role
  name: airw-bot
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airw-bot
  namespace: airw-research-experiments
subjects:
  - kind: ServiceAccount
    name: airw-bot
    namespace: airw-research-experiments
roleRef:
  kind: Role
  name: airw-bot
  apiGroup: rbac.authorization.k8s.io
